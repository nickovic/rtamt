name: Python package

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build and check distributions
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --upgrade build twine flake8 packaging
      - name: Check release tag
        run: python tools/check_release.py
      - name: Lint
        run: flake8 rtamt tests tools --count --select=E9,F63,F7,F82 --show-source --statistics
      - run: python -m build
      - run: python -m twine check --strict dist/*
      - name: Check distribution contents
        run: python tools/check_release.py --dist dist
      - uses: actions/upload-artifact@v4
        with:
          name: python-package-distributions
          path: dist/
          if-no-files-found: error

  test:
    name: Test ${{ matrix.distribution }} on Python ${{ matrix.python }}
    needs: build
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        python: ['3.8', '3.9', '3.10', '3.11', '3.12']
        distribution: [wheel, sdist]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/download-artifact@v4
        with:
          name: python-package-distributions
          path: dist/
      - run: python -m pip install --upgrade pip pytest pytest-cov
      - name: Test installed distribution outside checkout
        run: python tools/test_distribution.py ${{ matrix.distribution }}
      - name: Upload coverage
        if: matrix.python == '3.12' && matrix.distribution == 'wheel'
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage.xml
          fail_ci_if_error: false

  test-cpp:
    name: Test optional C++ backend
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      # Use the system Python matching Ubuntu's Boost.Python package.
      - run: sudo apt-get update && sudo apt-get install -y cmake libboost-python-dev libboost-system-dev python3-dev python3-venv
      - run: /usr/bin/python3 -m venv .venv
      - run: .venv/bin/python -m pip install --upgrade pip pytest
      - run: .venv/bin/python -m pip install -e .
      - run: cmake -S rtamt -B build/cpp -DPythonVersion=3 -DPython3_EXECUTABLE=/usr/bin/python3
      - run: cmake --build build/cpp --parallel 2
      - run: .venv/bin/python -m pytest tests/cpp

  publish-to-testpypi:
    name: Publish to TestPyPI
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: [build, test, test-cpp]
    runs-on: ubuntu-22.04
    environment:
      name: testpypi
      url: https://test.pypi.org/p/rtamt
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: python-package-distributions
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
          # For retries only; changed code needs a new version (see RELEASE.md).
          skip-existing: true

  publish-to-pypi:
    name: Publish to PyPI
    needs: publish-to-testpypi
    runs-on: ubuntu-22.04
    environment:
      name: pypi
      url: https://pypi.org/p/rtamt
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: python-package-distributions
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          skip-existing: true

  github-release:
    name: Sign distributions and create GitHub Release
    needs: publish-to-pypi
    runs-on: ubuntu-22.04
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: python-package-distributions
          path: dist/
      - uses: sigstore/gh-action-sigstore-python@v3.0.0
        with:
          inputs: >-
            ./dist/*.tar.gz
            ./dist/*.whl
      - name: Create release if needed and upload files
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --verify-tag --generate-notes
          fi
          gh release upload "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --clobber
